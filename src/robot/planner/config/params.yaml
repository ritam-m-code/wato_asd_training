planner_node:
  ros__parameters:
    # Metres from the goal at which the robot is considered to have arrived.
    goal_tolerance: 0.5
    # Cells at or above this cost are impassable. Combined with the costmap's
    # lethal core this blocks everything within ~1.32m of an obstacle, which
    # covers the chassis circumscribed radius of 1.12m with margin to spare.
    occupancy_threshold: 80
    # How strongly the decaying outer band is avoided. 0 plans the shortest path
    # regardless of clearance; higher takes wider berths around obstacles.
    cost_weight: 2.0
    # Seconds between replans while driving to a goal.
    replan_period: 1.0
    # odom/filtered reports the lidar frame, which sits this far ahead of the
    # chassis centre. Plan for the centre so the whole body clears obstacles.
    base_offset: 0.8
