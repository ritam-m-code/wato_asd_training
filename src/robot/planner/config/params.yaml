planner_node:
  ros__parameters:
    # Metres from the goal at which the robot is considered to have arrived.
    goal_tolerance: 0.5
    # Cells at or above this cost are impassable. Inflation peaks at 100 on the
    # obstacle itself, so 80 blocks the obstacle and its immediate surround while
    # leaving the outer falloff merely expensive.
    occupancy_threshold: 80
    # How strongly inflated cells are avoided. 0 ignores cost entirely and plans
    # the shortest path; higher values hug walls less and take wider berths.
    cost_weight: 2.0
    # Seconds between replans while driving to a goal.
    replan_period: 1.0
